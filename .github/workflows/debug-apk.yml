name: Debug APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - run: chmod +x gradlew && ./gradlew :androidApp:assembleFossDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kai-debug-apk
          path: androidApp/build/outputs/apk/foss/debug/*.apk
