name: Debug APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :androidApp:assembleFossDebug --stacktrace --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |What went wrong|FAILURE|Could not|Execution failed|error:|Caused by" -A2 build.log | head -45 | cut -c1-300 | awk '{printf "%s%%0A",$0}')
            echo "::error title=Gradle failed::$msg"
          fi
          exit $code
          - uses: actions/upload-artifact@v4
        with:
          name: kai-debug-apk
          path: androidApp/build/outputs/apk/foss/debug/*.apk
